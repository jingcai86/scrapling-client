<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scrapling Monitor — Multi-Provider Scraper Dashboard</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Outfit:wght@500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('theme') || 'system';
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark-theme');
          if (meta) meta.content = 'dark';
        } else if (theme === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.classList.remove('dark-theme');
          if (meta) meta.content = 'light';
        } else {
          document.documentElement.removeAttribute('data-theme');
          if (meta) meta.content = 'light dark';
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="mat-typography">
  <app-root></app-root>
</body>
</html>
