services:
  scrapling-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scrapling-dashboard
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data
